<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Model Diagnostics</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-weight: bold;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status.loading {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }
        .log {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.4;
        }
        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid #eee;
        }
        .log-entry:last-child {
            border-bottom: none;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px 5px 5px 0;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        .comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .test-result {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            margin: 10px 0;
            border-left: 4px solid #4CAF50;
        }
        .test-result.different {
            border-left-color: #4CAF50;
        }
        .test-result.same {
            border-left-color: #ff9800;
        }
    </style>
</head>
<body>
    <h1>🧪 ML Model Diagnostics</h1>
    
    <div class="container">
        <div class="panel">
            <h2>Static Model</h2>
            <div id="staticStatus" class="status loading">Loading...</div>
            <button onclick="testStaticModel()">Test Static Model</button>
            <button onclick="runStaticPathfinding()">Run Pathfinding Test</button>
            <div class="log" id="staticLog"></div>
        </div>
        
        <div class="panel">
            <h2>Dynamic (Variable Cost) Model</h2>
            <div id="dynamicStatus" class="status loading">Loading...</div>
            <button onclick="testDynamicModel()">Test Dynamic Model</button>
            <button onclick="runDynamicPathfinding()">Run Pathfinding Test</button>
            <div class="log" id="dynamicLog"></div>
        </div>
    </div>
    
    <div class="panel">
        <h2>Comparison</h2>
        <button onclick="compareModels()">Compare Model Predictions</button>
        <button onclick="runComparison()">Full Pathfinding Comparison</button>
        <button onclick="clearLogs()">Clear All Logs</button>
        <div id="comparisonResults" style="margin-top: 20px;"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>
    <script type="module">
        import { mlHeuristic, mlDynamicHeuristic } from './ml-heuristic.js';
        import { Pathfinder } from './pathfinder.js';
        import { GridGenerator } from './gridGenerator.js';
        
        window.mlHeuristic = mlHeuristic;
        window.mlDynamicHeuristic = mlDynamicHeuristic;
        window.Pathfinder = Pathfinder;
        window.GridGenerator = GridGenerator;

        const logs = {
            static: [],
            dynamic: [],
            comparison: []
        };

        // Intercept console logs
        const originalLog = console.log;
        const originalError = console.error;
        
        console.log = function(...args) {
            const msg = args.join(' ');
            originalLog(...args);
            
            if (msg.includes('[mlHeuristic') && !msg.includes('mlDynamicHeuristic')) {
                logs.static.push(msg);
                updateLog('static');
            } else if (msg.includes('[mlDynamicHeuristic')) {
                logs.dynamic.push(msg);
                updateLog('dynamic');
            } else if (msg.includes('[ML')) {
                logs.static.push(msg);
                logs.dynamic.push(msg);
                updateLog('static');
                updateLog('dynamic');
            }
        };
        
        console.error = function(...args) {
            const msg = args.join(' ');
            originalError(...args);
            
            if (msg.includes('[mlHeuristic') && !msg.includes('mlDynamicHeuristic')) {
                logs.static.push('❌ ' + msg);
                updateLog('static');
            } else if (msg.includes('[mlDynamicHeuristic')) {
                logs.dynamic.push('❌ ' + msg);
                updateLog('dynamic');
            }
        };

        function updateLog(type) {
            const logDiv = document.getElementById(type + 'Log');
            logDiv.innerHTML = logs[type]
                .slice(-50)  // Show last 50 entries
                .map(entry => `<div class="log-entry">${escapeHtml(entry)}</div>`)
                .join('');
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        window.clearLogs = function() {
            logs.static = [];
            logs.dynamic = [];
            logs.comparison = [];
            updateLog('static');
            updateLog('dynamic');
            document.getElementById('comparisonResults').innerHTML = '';
        };

        window.testStaticModel = async function() {
            const statusDiv = document.getElementById('staticStatus');
            statusDiv.className = 'status loading';
            statusDiv.textContent = 'Testing...';
            logs.static = [];
            
            try {
                const grid = GridGenerator.generateLayout(20, 20, 'Random', 'Medium');
                const start = { row: 0, col: 0 };
                const goal = { row: 19, col: 19 };
                
                const h1 = await mlHeuristic(start, goal, grid);
                
                if (typeof h1 === 'number' && h1 >= 0) {
                    statusDiv.className = 'status success';
                    statusDiv.textContent = `✓ Static Model Working - Heuristic value: ${h1.toFixed(2)}`;
                } else {
                    statusDiv.className = 'status error';
                    statusDiv.textContent = `✗ Static Model Error - Invalid return: ${h1}`;
                }
            } catch (e) {
                statusDiv.className = 'status error';
                statusDiv.textContent = `✗ Static Model Error: ${e.message}`;
            }
        };

        window.testDynamicModel = async function() {
            const statusDiv = document.getElementById('dynamicStatus');
            statusDiv.className = 'status loading';
            statusDiv.textContent = 'Testing...';
            logs.dynamic = [];
            
            try {
                const grid = GridGenerator.generateLayout(20, 20, 'Random', 'Medium', true);
                const start = { row: 0, col: 0 };
                const goal = { row: 19, col: 19 };
                
                const h1 = await mlDynamicHeuristic(start, goal, grid);
                
                if (typeof h1 === 'number' && h1 >= 0) {
                    statusDiv.className = 'status success';
                    statusDiv.textContent = `✓ Dynamic Model Working - Heuristic value: ${h1.toFixed(2)}`;
                } else {
                    statusDiv.className = 'status error';
                    statusDiv.textContent = `✗ Dynamic Model Error - Invalid return: ${h1}`;
                }
            } catch (e) {
                statusDiv.className = 'status error';
                statusDiv.textContent = `✗ Dynamic Model Error: ${e.message}`;
            }
        };

        window.compareModels = async function() {
            const resultsDiv = document.getElementById('comparisonResults');
            resultsDiv.innerHTML = '<p>Testing predictions on same grid...</p>';
            logs.comparison = [];

            try {
                const grid = GridGenerator.generateLayout(20, 20, 'Random', 'Medium');
                const start = { row: 2, col: 2 };
                const goal = { row: 17, col: 17 };

                const staticH = await mlHeuristic(start, goal, grid);
                const dynamicH = await mlDynamicHeuristic(start, goal, grid);

                const diff = Math.abs(staticH - dynamicH);
                const percentDiff = (diff / Math.max(staticH, dynamicH, 1) * 100).toFixed(1);
                
                const html = `
                    <div class="test-result ${diff > 0.5 ? 'different' : 'same'}">
                        <strong>Grid Type:</strong> Static Grid (same for both)<br>
                        <strong>Start:</strong> (2, 2) | <strong>Goal:</strong> (17, 17)<br><br>
                        <strong>Static Model Prediction:</strong> ${staticH.toFixed(4)}<br>
                        <strong>Dynamic Model Prediction:</strong> ${dynamicH.toFixed(4)}<br><br>
                        <strong>Difference:</strong> ${diff.toFixed(4)} (${percentDiff}%)<br>
                        <strong>Result:</strong> ${diff > 0.5 ? '✓ Models are DIFFERENT' : '⚠ Models give SAME prediction'}
                    </div>
                `;
                resultsDiv.innerHTML = html;
            } catch (e) {
                resultsDiv.innerHTML = `<div class="test-result error">Error: ${e.message}</div>`;
            }
        };

        window.runComparison = async function() {
            const resultsDiv = document.getElementById('comparisonResults');
            resultsDiv.innerHTML = '<p>Running full pathfinding comparison...</p>';
            
            try {
                // Test on variable cost grid
                const grid = GridGenerator.generateLayout(20, 20, 'Random', 'Medium', true);
                const start = { row: 0, col: 0 };
                const goal = { row: 19, col: 19 };

                const pf1 = new Pathfinder(grid);
                const pf2 = new Pathfinder(grid);

                // Run with static heuristic
                const r1 = await new Promise((resolve) => {
                    pf1.runAsync(start, goal, null, (success, nodes, dist) => {
                        resolve({ success, nodes, dist });
                    });
                });

                // Run with dynamic heuristic
                const r2 = await new Promise((resolve) => {
                    pf2.runAsync(start, goal, null, (success, nodes, dist) => {
                        resolve({ success, nodes, dist });
                    });
                });

                // Compare (you may need to adjust this based on actual Pathfinder API)
                const improvement = r1.nodes > r2.nodes ? 
                    ((r1.nodes - r2.nodes) / r1.nodes * 100).toFixed(1) : 
                    ((r2.nodes - r1.nodes) / r2.nodes * 100).toFixed(1);

                const html = `
                    <div class="test-result">
                        <strong>Test on Variable Cost Grid (${grid.length}x${grid[0].length})</strong><br><br>
                        <strong>Static Heuristic Results:</strong><br>
                        - Success: ${r1.success} | Nodes: ${r1.nodes} | Distance: ${r1.dist.toFixed(2)}<br><br>
                        <strong>Dynamic Heuristic Results:</strong><br>
                        - Success: ${r2.success} | Nodes: ${r2.nodes} | Distance: ${r2.dist.toFixed(2)}<br><br>
                        <strong>Comparison:</strong> ${improvement}% difference in nodes explored
                    </div>
                `;
                resultsDiv.innerHTML = html;
            } catch (e) {
                resultsDiv.innerHTML = `<div class="test-result error">Error: ${e.message}</div>`;
            }
        };

        // Auto-test both models on load
        setTimeout(() => {
            window.testStaticModel();
            window.testDynamicModel();
        }, 500);
    </script>
</body>
</html>
